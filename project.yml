name: ReimsJB
options:
  bundleIdPrefix: dev.reimsjb
  deploymentTarget:
    iOS: "16.0"
targets:
  ReimsJB:
    type: application
    platform: iOS
    sources:
      - path: ReimsJB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reimsjb.lab
        PRODUCT_NAME: ReimsJB
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ReimsJB
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGNING_ALLOWED: NO
