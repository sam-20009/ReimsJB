name: ReimsJB unit tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ReimsJB/**"
      - "ReimsJBTests/**"
      - "project.yml"
      - ".github/workflows/unit-tests.yml"
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Find an iPhone simulator
        run: |
          set -euo pipefail
          mkdir -p build
          xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next((x["udid"] for v in d.values() for x in v if "iPhone" in x["name"] and x.get("isAvailable", False)), ""))' > build/sim-udid
          test -s build/sim-udid
      - name: XCTest on iPhone simulator
        run: |
          set -euo pipefail
          SIM_ID=$(cat build/sim-udid)
          xcodebuild test -project ReimsJB.xcodeproj -scheme ReimsJB -configuration Debug -destination "platform=iOS Simulator,id=$SIM_ID" -resultBundlePath build/UnitTests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Publish XCTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReimsJB-unit-tests
          path: build/UnitTests.xcresult
          if-no-files-found: ignore
          retention-days: 14
